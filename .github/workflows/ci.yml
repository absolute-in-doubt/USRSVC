name: Run Tests

on:
  push:
    branches: [ main, feature/USRSVC ]
  pull_request:
    branches: [ main, feature/USRSVC ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with Maven
        run: mvn clean test