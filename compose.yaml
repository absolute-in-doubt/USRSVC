services:
  app:
    build: .
    env_file:
      - app.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: 'postgres:15'
    env_file:
      - postgres.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
volumes:
  postgres_data: